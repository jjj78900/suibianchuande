*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;

#stage{position:fixed;inset:0;display:flex;justify-content:center;background:#000}

/* ---------- 滚动容器 ---------- */
#feed{position:relative;height:100%;width:100%;max-width:480px;overflow-y:scroll;
  scroll-snap-type:y mandatory;scroll-behavior:auto;overscroll-behavior-y:contain;

#feed::-webkit-scrollbar{display:none}
@media(min-width:600px){

}

.slide{position:relative;height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;
  overflow:hidden;background:#000;contain:strict}
.slide .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:blur(12px) brightness(.55);transform:scale(1.06);transition:opacity .35s}
.slide .mbox{position:absolute;inset:0}
.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.slide .grad{position:absolute;inset:0;pointer-events:none;

/* 播放/暂停中央图标 */
.slide .picon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .18s}
.slide .picon svg{width:74px;height:74px;filter:drop-shadow(0 2px 12px rgba(0,0,0,.6));opacity:.9}
.slide.paused .picon{opacity:1}
.slide.paused .picon{background:rgba(0,0,0,.12)}

/* ---------- 底部信息 ---------- */
.meta{position:absolute;left:16px;right:calc(var(--rail) + 16px);bottom:calc(26px + env(safe-area-inset-bottom));

.meta .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;pointer-events:auto}
.meta .tags span{font-size:12px;font-weight:600;line-height:1;padding:6px 9px;border-radius:99px;

var CATS=[{"k":"all","n":"推荐"},{"k":"nude-tiktoks","n":"全裸"},{"k":"boobs-tiktoks","n":"美胸"},{"k":"dance-tiktoks","n":"舞蹈"},{"k":"thots-tiktoks","n":"骚货"},{"k":"nsfw-tiktoks","n":"成人"},{"k":"cosplay-tiktoks","n":"COS"},{"k":"asian-tiktoks","n":"亚洲"},{"k":"thickass-tiktoks","n":"翘臀"},{"k":"teens-tiktoks","n":"少女"},{"k":"latina-tiktoks","n":"拉丁"},{"k":"lingerie-tiktoks","n":"内衣"},{"k":"fitchick-tiktoks","n":"健身娘"},{"k":"teasy-tiktoks","n":"诱惑"},{"k":"twerk-tiktoks","n":"电臀"},{"k":"live-tiktoks","n":"直播"},{"k":"leaked-tiktoks","n":"泄露"},{"k":"petite-girls","n":"娇小"},{"k":"milf-tiktoks","n":"熟女"},{"k":"nipslip-tiktoks","n":"走光"},{"k":"masturbation-tiktoks","n":"自慰"},{"k":"xxx-tiktoks","n":"硬核"},{"k":"blowjob-tiktoks","n":"口活"},{"k":"workout-tiktoks","n":"运动"}];           // [{k:'slug',n:'中文'}]
var RAW=window.__DATA__;     // [title, thumb, link, tagIdxs, views, likes, dur]
var ALL=RAW.map(function(r){
  return {t:r[0], p:IMG+r[1], v:IMG+r[2], g:r[3], w:r[4], l:r[5], d:r[6]};
});

/* ================= 状态 ================= */
var feed=document.getElementById('feed'),
    catsEl=document.getElementById('cats'),
    cntEl=document.getElementById('cnt'),
    catNameEl=document.getElementById('catName'),
    hintEl=document.getElementById('hint');

var list=ALL.slice();      // 当前分类列表
var curCat='all';
var cur=0;                 // 当前索引
var rendered=0;            // 已渲染数量
var CHUNK=12;              // 每批渲染
var mounted={};            // idx -> video
var muted=true;
var liked={};
try{ liked=JSON.parse(localStorage.getItem('reels_liked')||'{}'); }catch(e){ liked={}; }
var userPaused=false;
var ticker=null;

/* ================= 工具 ================= */
function num(n){
  n=+n||0;
  if(n>=10000) return (n/10000).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'w';
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return ''+n;
}
function el(tag,cls,html){ var d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; }
var ICON={
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.3-9.2C1.6 8.9 3.6 5.5 7 5.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.4 3.4 4.3 6.3C19.5 16.4 12 21 12 21z"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12C3.7 7.9 7.5 5 12 5c4.5 0 8.3 2.9 9.5 7-1.2 4.1-5 7-9.5 7-4.5 0-8.3-2.9-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"/><path d="M12 16V3"/><path d="M8 7l4-4 4 4"/></svg>',
  sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M17 9l4 6"/><path d="M21 9l-4 6"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 001.53.85l10-6.5a1 1 0 000-1.7l-10-6.5A1 1 0 008 5.5z"/></svg>',
  retry:'重试'
};

/* ================= 分类条 ================= */
function hasCat(item,ci){ return (','+item.g+',').indexOf(','+ci+',')>=0; }
function buildCats(){
  catsEl.innerHTML='';
  CATS.forEach(function(c,ci){
    if(ci>0 && !ALL.some(function(x){ return hasCat(x,ci); })) return;
    var b=el('button',ci===curCat?'on':'',''+c.n);
    b.dataset.ci=ci;
    b.onclick=function(){ setCat(ci); };
    catsEl.appendChild(b);
  });
}
function setCat(ci){
  if(ci===curCat) return;
  curCat=ci;
  list = (ci===0) ? ALL.slice() : ALL.filter(function(x){ return hasCat(x,ci); });
  Array.prototype.forEach.call(catsEl.children,function(b){
    b.classList.toggle('on', +b.dataset.ci===ci);
  });
  catNameEl.textContent=CATS[ci]?CATS[ci].n:'推荐';
  rebuild();
  var on=catsEl.querySelector('button.on');
  if(on) on.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}

/* ================= 卡片渲染 ================= */
function makeSlide(i){
  var d=list[i];
  var s=el('div','slide');
  s.dataset.i=i;
  var poster=el('img','poster');
  poster.src=d.p; poster.alt=''; poster.loading='lazy'; poster.decoding='async';
  poster.addEventListener('load',function(){ poster.style.opacity='1'; });
  s.appendChild(poster);
  s.appendChild(el('div','mbox'));
  s.appendChild(el('div','grad'));
  s.appendChild(el('div','picon',''+ICON.play));

  /* 底部信息 */
  var meta=el('div','meta');
  var tags=el('div','tags');
  var first=(d.g||'').split(',')[0];
  (d.g||'').split(',').forEach(function(gi){
    var ci=+gi, c=CATS[ci];
    if(!c) return;
    var hot = (curCat===0) ? (gi===first) : (ci===curCat);
    var t=el('span',hot?'hot':'','#'+c.n);
    t.onclick=function(e){ e.stopPropagation(); setCat(ci); };
    tags.appendChild(t);
  });
  meta.appendChild(tags);
  var h2=document.createElement('h2'); h2.textContent=d.t; meta.appendChild(h2);
  meta.appendChild(el('div','sub','<i>'+num(d.w)+' 次观看</i><i>'+num(d.l)+' 赞</i><i>'+(d.d||'')+' 秒</i>'));
  s.appendChild(meta);

  /* 右侧栏 */
  var rail=el('div','rail');
  var av=el('div','avatar','R'); rail.appendChild(av);

  var like=el('button','like'+(liked[d.v]?' on':''));
  like.innerHTML=ICON.heart+'<span class="num">'+num(d.l)+'</span>';
  like.onclick=function(e){
    e.stopPropagation();
    var on=!liked[d.v];
    liked[d.v]=on;
    like.classList.toggle('on',on);
    like.classList.add('bump');
    setTimeout(function(){like.classList.remove('bump');},400);
    var c=+d.l+(on?1:0);
    like.querySelector('.num').textContent=num(c);
    try{ localStorage.setItem('reels_liked',JSON.stringify(liked)); }catch(err){}
    if(on) heartBurst(s);
  };
  rail.appendChild(like);

  var views=el('button');
  views.innerHTML=ICON.eye+'<span class="num">'+num(d.w)+'</span>';
  views.onclick=function(e){e.stopPropagation();};
  rail.appendChild(views);

  var share=el('button');
  share.innerHTML=ICON.share+'<span class="num">分享</span>';
  share.onclick=function(e){
    e.stopPropagation();
    var url=d.v;
    if(navigator.share){ navigator.share({title:d.t,url:url}).catch(function(){}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ toast('视频直链已复制'); }).catch(function(){ toast('长按标题复制'); }); }
    else { toast('长按标题复制'); }
  };
  rail.appendChild(share);

  var snd=el('button','snd');
  snd.innerHTML=(muted?ICON.mute:ICON.sound)+'<span class="num">'+(muted?'静音':'声音')+'</span>';
  snd.onclick=function(e){
    e.stopPropagation();
    muted=!muted;
    Object.keys(mounted).forEach(function(k){
      var v=mounted[k]; if(v) v.video.muted=muted;
    });
    document.querySelectorAll('.snd').forEach(function(b){
      b.innerHTML=(muted?ICON.mute:ICON.sound)+'<span class="num">'+(muted?'静音':'声音')+'</span>';
    });
  };
  rail.appendChild(snd);
  s.appendChild(rail);

  /* 进度条 */
  var bar=el('div','pbar','<i></i>');
  s.appendChild(bar);

  /* 点击暂停 */
  s.addEventListener('click',function(){ togglePlay(); });

  return s;
}

function heartBurst(slide){
  var h=el('div','');
  h.style.cssText='position:absolute;left:50%;top:50%;width:96px;height:96px;transform:translate(-50%,-50%) scale(.4);'+
    'opacity:0;z-index:4;pointer-events:none;color:#fe2c55';
  h.innerHTML=ICON.heart;
  h.firstChild.style.cssText='width:100%;height:100%;fill:#fe2c55;stroke:#fe2c55';
  slide.appendChild(h);
  h.animate([
    {opacity:0,transform:'translate(-50%,-50%) scale(.4)'},
    {opacity:1,transform:'translate(-50%,-50%) scale(1.15)',offset:.35},
    {opacity:0,transform:'translate(-50%,-58%) scale(1.4)'}
  ],{duration:800,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=function(){ h.remove(); };
}

/* ================= 视频挂载 ================= */
function mount(i){
  if(mounted[i]) return mounted[i];
  var slide=feed.querySelector('.slide[data-i="'+i+'"]');
  if(!slide) return null;
  var d=list[i];
  var box=slide.querySelector('.mbox');
  var v=document.createElement('video');
  v.playsInline=true; v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
  v.preload='auto'; v.loop=true; v.muted=muted;
  v.src=d.v;

  var spin=el('div','spinner');
  box.appendChild(spin);

  var obj={video:v,slide:slide,ready:false};
  mounted[i]=obj;

  v.addEventListener('loadeddata',function(){ obj.ready=true; if(spin.parentNode) spin.remove(); });
  v.addEventListener('playing',function(){
    slide.classList.remove('paused');
    if(spin.parentNode) spin.remove();
    startTicker(i);
  });
  v.addEventListener('timeupdate',function(){
    var bar=slide.querySelector('.pbar i');
    if(bar && v.duration) bar.style.width=(v.currentTime/v.duration*100)+'%';
  });
  v.addEventListener('error',function(){
    if(spin.parentNode) spin.remove();
    showFail(slide,i);
  });
  box.appendChild(v);
  if(i===cur) v.play().catch(function(){ slide.classList.add('paused'); });
  return obj;
}

function unmount(i){
  var o=mounted[i];
  if(!o) return;
  try{ o.video.pause(); }catch(e){}
  o.video.removeAttribute('src');
  try{ o.video.load(); }catch(e){}
  o.video.remove();
  delete mounted[i];
}

function showFail(slide,i){
  var old=slide.querySelector('.vfail'); if(old) return;
  var f=el('div','vfail','视频加载失败，可能是网络或地区限制');
  var b=el('button',null,'重试');
  b.onclick=function(e){
    e.stopPropagation();
    f.remove();
    var o=mounted[i];
    if(o){ o.video.src=list[i].v; o.video.load(); o.video.play().catch(function(){}); }
    else mount(i);
  };
  f.appendChild(b);
  slide.appendChild(f);
}

function startTicker(i){}

function togglePlay(){
  var o=mounted[cur];
  if(!o) { mount(cur); return; }
  if(o.video.paused){ o.video.play().catch(function(){}); o.slide.classList.remove('paused'); userPaused=false; }
  else { o.video.pause(); o.slide.classList.add('paused'); userPaused=true; }
}

/* ================= 当前索引 / 预加载 ================= */
function setCurrent(i){
  if(i===cur) return;
  var prev=cur;
  cur=i;
  userPaused=false;
  Object.keys(mounted).forEach(function(k){
    var n=+k;
    if(Math.abs(n-i)>1) unmount(n);
    else if(n!==i && mounted[n]) { try{ mounted[n].video.pause(); }catch(e){} }
  });
  var o=mounted[i] ? mounted[i] : mount(i);
  if(o && !userPaused){ o.video.muted=muted; o.video.play().catch(function(){ o.slide.classList.add('paused'); }); o.slide.classList.remove('paused'); }
  else if(o){ o.slide.classList.add('paused'); }
  // 预加载前一个
  if(i-1>=0) mount(i-1);
  if(i+1<list.length) mount(i+1);
  // 接近底部就续渲染
  if(i > rendered-4) appendChunk();
  document.title=list[i] ? (list[i].t.slice(0,40)+' · Reels') : 'Reels';
}

/* ================= 分批渲染 ================= */
function appendChunk(){
  var end=Math.min(rendered+CHUNK, list.length);
  if(rendered>=list.length) return;
  var frag=document.createDocumentFragment();
  for(var i=rendered;i<end;i++) frag.appendChild(makeSlide(i));
  feed.appendChild(frag);
  rendered=end;
  observeSlides();
  updateCount();
}
function updateCount(){
  cntEl.textContent=list.length+' 个视频';
}
function rebuild(){
  Object.keys(mounted).forEach(function(k){ unmount(+k); });
  mounted={};
  rendered=0; cur=0; userPaused=false;
  feed.innerHTML='';
  if(!list.length){
    feed.appendChild(el('div','slide','<div id="end">这个分类暂时没有视频</div>'));
    updateCount(); return;
  }
  appendChunk();
  feed.scrollTop=0;
  setTimeout(function(){
    var o=mount(0);
    if(o && !userPaused){ o.slide.classList.remove('paused'); o.video.play().catch(function(){}); }
  },60);
  updateCount();
}

/* ================= 滚动检测 ================= */
var io=new IntersectionObserver(function(entries){
  var best=null,bestR=0;
  entries.forEach(function(en){
    if(en.isIntersecting && en.intersectionRatio>bestR){ bestR=en.intersectionRatio; best=en.target; }
  });
  if(best && bestR>0.55){ setCurrent(+best.dataset.i); }
},{root:feed,threshold:[0.55,0.7,0.95]});

var observed=new WeakSet();
function observeSlides(){
  Array.prototype.forEach.call(feed.children,function(s){
    if(s.dataset.i!=null && !observed.has(s)){ observed.add(s); io.observe(s); }
  });
}

feed.addEventListener('scroll',function(){
  if(rendered>=list.length) return;
  if(feed.scrollTop + feed.clientHeight*3 > feed.scrollHeight){ appendChunk(); }
},{passive:true});

/* 滚轮 / 键盘 */
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'||e.key==='PageDown'){ e.preventDefault(); go(1); }
  else if(e.key==='ArrowUp'||e.key==='PageUp'){ e.preventDefault(); go(-1); }
  else if(e.key===' '){ e.preventDefault(); togglePlay(); }
  else if(e.key==='m'||e.key==='M'){ var s=document.querySelector('.snd'); if(s)s.click(); }
});
function go(d){
  var t=Math.max(0,Math.min(list.length-1,cur+d));
  var s=feed.querySelector('.slide[data-i="'+t+'"]');
  if(s) s.scrollIntoView({behavior:'smooth',block:'start'});
  else { appendChunk(); setTimeout(function(){ var s2=feed.querySelector('.slide[data-i="'+t+'"]'); if(s2)s2.scrollIntoView({behavior:'smooth',block:'start'}); },80); }
}

/* ================= 提示 ================= */
function toast(msg){
  hintEl.innerHTML=msg;
  hintEl.classList.add('show');
  setTimeout(function(){ hintEl.classList.remove('show'); },1600);
}

/* ================= 启动 ================= */
buildCats();
catNameEl.textContent='推荐';
rebuild();
updateCount();

/* 首次提示 */
setTimeout(function(){
  hintEl.classList.add('show');
  setTimeout(function(){ hintEl.classList.remove('show'); },4200);
},700);

/* 页面隐藏时暂停 */
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ Object.keys(mounted).forEach(function(k){ try{mounted[k].video.pause();}catch(e){} }); }
  else { var o=mounted[cur]; if(o && !userPaused){ o.video.play().catch(function(){}); } }
});
})();
</script>
